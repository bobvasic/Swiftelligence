[package]
name = "swiftel"
version = "0.1.0"
edition = "2024"
description = "A small, evidence-aware public web research CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bobvasic/Swiftelligence"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "json"] }
roxmltree = "0.20"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
url = "2"
