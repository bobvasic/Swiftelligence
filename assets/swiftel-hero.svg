<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Swiftel — public web intelligence, from your terminal</title>
<desc id="desc">Crimson signal marks, connected source lines, and a dark terminal-inspired wordmark.</desc>
